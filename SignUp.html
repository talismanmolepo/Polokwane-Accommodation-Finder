<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up Page</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Container Card */
    .signup-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 420px;
    }

    .signup-card h2 {
      margin-bottom: 8px;
      color: #1f2937;
      text-align: center;
      font-size: 1.75rem;
    }

    .signup-card p.subtitle {
      color: #6b7280;
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.875rem;
      color: #374151;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    /* Toggle Password Button */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 0.8rem;
    }

    /* Checkbox & Terms */
    .terms-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #4b5563;
    }

    .terms-group input[type="checkbox"] {
      margin-top: 3px;
    }

    .terms-group a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }

    .terms-group a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #4338ca;
    }

    /* Error Message Styling */
    .error-msg {
      color: #dc2626;
      font-size: 0.8rem;
      margin-top: 4px;
      display: none;
    }

    /* Footer Text */
    .form-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .form-footer a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="signup-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join us today! It takes less than a minute.</p>

    <form id="signupForm" onsubmit="handleSignUp(event)">
      <!-- Full Name Field -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="fullName" 
            placeholder="John Doe" 
            required 
          />
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required 
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="At least 8 characters" 
            minlength="8"
            required 
          />
          <button 
            type="button" 
            class="toggle-password" 
            onclick="toggleVisibility('password', this)"
          >
            Show
          </button>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Re-enter your password" 
            required 
          />
          <button 
            type="button" 
            class="toggle-password" 
            onclick="toggleVisibility('confirmPassword', this)"
          >
            Show
          </button>
        </div>
        <span id="passwordError" class="error-msg">Passwords do not match.</span>
      </div>

      <!-- Terms & Conditions Checkbox -->
      <div class="terms-group">
        <input type="checkbox" id="terms" required />
        <label for="terms">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="form-footer">
      Already have an account? <a href="#">Log in</a>
    </div>
  </div>

  <script>
    // Toggle Password Visibility
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    // Handle Form Submission with Basic Password Matching Validation
    function handleSignUp(event) {
      event.preventDefault();
      
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMsg = document.getElementById('passwordError');

      // Check if passwords match
      if (password !== confirmPassword) {
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';

      // Send signup data to server / API
      console.log('Signing up with:', { fullName, email, password });
      alert('Account created successfully! Check the browser console.');
    }
  </script>

</body>
</html>
